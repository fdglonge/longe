apiVersion: apps/v1
kind: Deployment
metadata:
  name: longeviva-api
  labels:
    app: longeviva-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: longeviva-api
  template:
    metadata:
      labels:
        app: longeviva-api
    spec:
      containers:
      - name: longeviva-api
        image: gcr.io/PROJECT_ID/longeviva-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "PROJECT_ID"
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: longeviva-api-service
spec:
  selector:
    app: longeviva-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer